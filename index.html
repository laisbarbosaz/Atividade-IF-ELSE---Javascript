<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade IF ELSE - Javascript</title>
</head>
<body>

    <h1>Cálculo da Média</h1>

    <button onclick="calcularMedia()">Calcular média</button>

    <script>

        function calcularMedia() {

            let nota1 = Number(prompt("Digite a primeira nota:"));
            let nota2 = Number(prompt("Digite a segunda nota:"));
            let nota3 = Number(prompt("Digite a terceira nota:"));

            let media = (nota1 + nota2 + nota3) / 3;

            let situacao;
            if (media >= 7) {
                situacao = "Aprovado";
            } else {
                situacao = "Reprovado";
            }

       
            document.write("<h2>Resultado - Status do Aluno </h2>");
            document.write("<p>Nota 1: " + nota1 + "</p>");
            document.write("<p>Nota 2: " + nota2 + "</p>");
            document.write("<p>Nota 3: " + nota3 + "</p>");
            document.write("<p>Média: " + media.toFixed(2) + "</p>");
            document.write("<p>Situação: " + situacao + "</p>");

 
            console.log("Média:", media.toFixed(2));
            console.log("Situação:", situacao);

            alert("Situação do aluno: " + situacao);
        }

    </script>

</body>
</html>
